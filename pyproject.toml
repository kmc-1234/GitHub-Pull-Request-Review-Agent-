[project]
name = "github-pr-review-agent"
version = "0.1.0"
description = "AI-assisted GitHub pull request review agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "celery[redis]>=5.4.0",
  "cryptography>=43.0.0",
  "fastapi>=0.112.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "prometheus-client>=0.20.0",
  "psycopg[binary]>=3.2.1",
  "PyJWT>=2.9.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "python-json-logger>=2.0.7",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "respx>=0.21.1",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105"]
"app/analyzers/runner.py" = ["S603"]

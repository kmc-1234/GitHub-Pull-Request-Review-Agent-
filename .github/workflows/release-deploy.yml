name: Versioned Build Test Push Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to build, push, and deploy, for example v0.1.0
        required: true
        default: v0.1.0
      namespace:
        description: Kubernetes namespace
        required: true
        default: pr-review-agent
      deploy:
        description: Deploy to Kubernetes after Docker Hub push
        required: true
        type: boolean
        default: true
      ingress_host:
        description: Public host name for the webhook endpoint
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: kmc173/github-pull-request-review-agent
  RELEASE_NAME: pr-review-agent
  CHART_PATH: deploy/helm/pr-review-agent
  APP_SECRET_NAME: pr-review-agent-secrets

jobs:
  validate-version:
    name: Validate version input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate semantic version tag
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match vMAJOR.MINOR.PATCH, for example v0.1.0" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests and chart checks
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm chart
        run: helm lint "$CHART_PATH"

      - name: Render Helm chart with release image tag
        run: |
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="${{ needs.validate-version.outputs.version }}"

  build-and-push:
    name: Build and push versioned Docker image
    runs-on: ubuntu-latest
    needs: [validate-version, test]
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ needs.validate-version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: image
        run: echo "image=$IMAGE_REPOSITORY:${{ needs.validate-version.outputs.version }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy pushed image with Helm
    runs-on: ubuntu-latest
    needs: [validate-version, build-and-push]
    if: ${{ inputs.deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.3

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_BASE64}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}

      - name: Confirm pushed Docker image exists
        run: docker manifest inspect "${{ needs.build-and-push.outputs.image }}" > /dev/null

      - name: Create namespace
        run: kubectl create namespace "${{ inputs.namespace }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update application secret
        run: |
          kubectl -n "${{ inputs.namespace }}" create secret generic "$APP_SECRET_NAME" \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=REDIS_URL="${REDIS_URL}" \
            --from-literal=GITHUB_WEBHOOK_SECRET="${GITHUB_WEBHOOK_SECRET}" \
            --from-literal=GITHUB_APP_ID="${GITHUB_APP_ID}" \
            --from-literal=GITHUB_PRIVATE_KEY="${GITHUB_PRIVATE_KEY}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GITHUB_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy exact image version with Helm
        run: |
          INGRESS_ARGS=()
          if [ -n "${{ inputs.ingress_host }}" ]; then
            INGRESS_ARGS=(
              --set ingress.enabled=true
              --set-string ingress.host="${{ inputs.ingress_host }}"
            )
          fi

          helm upgrade --install "$RELEASE_NAME" "$CHART_PATH" \
            --namespace "${{ inputs.namespace }}" \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="${{ needs.validate-version.outputs.version }}" \
            --set-string existingSecret.name="$APP_SECRET_NAME" \
            "${INGRESS_ARGS[@]}"

      - name: Verify Kubernetes rollout
        run: |
          kubectl -n "${{ inputs.namespace }}" rollout status deploy/pr-review-agent-api --timeout=180s
          kubectl -n "${{ inputs.namespace }}" rollout status deploy/pr-review-agent-worker --timeout=180s

      - name: Show deployed image
        run: |
          kubectl -n "${{ inputs.namespace }}" get deploy pr-review-agent-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
